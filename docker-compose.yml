services:
  gigorga:
    build: .
    image: gigorga
    ports:
      - "3000:3000"
    environment:
      ORIGIN: ${ORIGIN}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    volumes:
      - gigorga-data:/data
    restart: unless-stopped

volumes:
  gigorga-data:
