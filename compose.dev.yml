# Local Pocket ID for development only. Production runs its own Pocket ID next to the reverse proxy.
services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.18.0
    ports:
      - "1411:1411"
    environment:
      APP_URL: http://localhost:1411
      ENCRYPTION_KEY: +G2C6h0vzK10C4CzZeALXED6+tqNestLs0590INvgb4=
    volumes:
      - pocket-id-dev:/app/data

volumes:
  pocket-id-dev:
